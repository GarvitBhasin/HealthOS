<!DOCTYPE html>
<html lang="en">
    <head>
        <title>HealthOS | Settings</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/static/css/general.css">
        <link rel="stylesheet" href="/static/css/user-settings.css">
        <link rel="stylesheet" href="/static/css/index.css">
        <link rel="icon" type="image/png" href="/static/images/HealthOS-logo.png">
    </head>
    <body>
        <nav>
            <div class="nav-left">
                <img src="/static/images/HealthOS-logo.png" alt="healthos logo" width="55px" height="55px" class="logo">
                <a href="/">
                    <div>
                        Home
                    </div>
                </a>
                <a href="/results">
                    <div>
                        Results
                    </div>
                </a>
                <a href="/dashboard">
                    <div>
                        Dashboard
                    </div>
                </a>
            </div>
            <div class="nav-right">
                <div class="theme-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="moon-icon" viewBox="0 0 16 16">
                        <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278M4.858 1.311A7.27 7.27 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.32 7.32 0 0 0 5.205-2.162q-.506.063-1.029.063c-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286"/>
                    </svg>
                </div>
                <div class="no-account-buttons">
                    <a href="/sign-up">
                        <button class="black-fill-button">
                            Sign Up
                        </button>
                    </a>
                    <a href="/login">
                        <button class="black-outline-button">
                            Login
                        </button>
                    </a>
                </div>
                <div class="my-account-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                    </svg>
                    <div class="account-dropdown">
                        <div class="user-email"></div>
                        <hr>
                        <a href="/user-settings">
                            <button class="black-fill-button js-settings-button">Settings</button>
                        </a>
                        <button class="black-fill-button js-logout-button">Logout</button>
                    </div>
                </div>
            </div>
        </nav>
        <main>
            <div class="heading">
                Account Settings
            </div>
            <div class="account-info">
                <div class="display-user-email">
                </div>
                <div class="display-creation-date">
                </div>
                <div class="display-verification">
                </div>
                <button class="red-fill-button js-delete-button">
                    Delete Account
                </button>
                <button class="black-fill-button js-pwreset-button">
                    Reset Password
                </button>
            </div>
            <dialog class="js-confirmation">
                <div>Are you sure you want to delete this account?</div>
                <div class="button-container">
                    <button class="js-yes-btn black-outline-button">Yes</button>
                    <button class="js-no-btn black-outline-button">No</button>
                </div>
            </dialog>
            <dialog class="js-verification">
                <div>Enter the email and password of this account:</div>
                <input type="email" class="js-email-confirmation-input" placeholder="Email">
                <input type="password" class="js-password-confirmation-input" placeholder="Password">
                <div class="error-message"></div>
                <div class="success-message"></div>
                <div class="button-container">
                    <button class="js-email-confirmation-button red-fill-button loading-button">
                        <span class="button-content">Delete</span>
                        <span class="spinner"></span>
                    </button>
                    <button class="js-cancel-btn black-fill-button">
                        Cancel
                    </button>
                </div>
            </dialog>
        </main>
        <footer>
            <div>
                <div>
                    <a href="https://garvitbhasin.netlify.app" target="_blank">
                        Garvit Bhasin
                    </a>
                </div>
                <div>
                    <a href="/faq">
                        FAQ
                    </a>
                </div>
            </div>
            <img src="/static/images/HealthOS-logo.png" alt="healthos logo" width="55px" height="55px" class="footer-logo">
        </footer>
        <script type="module" src="/static/js/general.js"></script>
        <script type="module" src="/static/js/user-settings.js"></script>
    </body>
</html>
